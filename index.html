<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulačka firemní akce</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #20242d;
    --line: #2c313c;
    --text: #e8eaf0;
    --muted: #8b92a3;
    --accent: #4f8cff;
    --accent-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { margin-bottom: 22px; }
  .row:last-child { margin-bottom: 0; }
  .label { display: block; font-weight: 600; margin-bottom: 10px; }

  .stepper { display: flex; gap: 10px; }
  .stepper button {
    width: 64px; height: 64px; flex: none;
    font-size: 28px; font-weight: 600;
  }
  .stepper input {
    flex: 1; min-width: 0; height: 64px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 26px; font-weight: 600; text-align: center;
  }
  .stepper input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle button { height: 60px; font-size: 19px; font-weight: 600; }

  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  button:hover { border-color: var(--muted); }
  button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-text);
  }

  .result .line {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 0; font-variant-numeric: tabular-nums;
  }
  .result .muted { color: var(--muted); }
  .result .total {
    border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px;
    font-size: 26px; font-weight: 700;
  }

  details summary { cursor: pointer; font-weight: 600; }
  .pricelist { margin: 14px 0 0; }
  .price {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .price label { color: var(--muted); }
  .price .field { display: flex; align-items: center; gap: 8px; flex: none; }
  .price input {
    width: 110px; height: 48px; padding: 0 10px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 18px; font-weight: 600; text-align: right;
  }
  .price input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .price .unit { color: var(--muted); font-size: 14px; width: 92px; }
  .reset { width: 100%; height: 52px; margin-top: 16px; font-size: 17px; font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Kalkulačka firemní akce</h1>
  <p class="sub">Orientační cena podle počtu hostů, délky a služeb.</p>

  <section class="card">
    <div class="row">
      <span class="label">Počet hostů</span>
      <div class="stepper">
        <button type="button" data-step="hoste" data-delta="-5" aria-label="Ubrat 5 hostů">−</button>
        <input id="hoste" type="number" inputmode="numeric" min="1" value="50">
        <button type="button" data-step="hoste" data-delta="5" aria-label="Přidat 5 hostů">+</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Délka akce (hodiny)</span>
      <div class="stepper">
        <button type="button" data-step="hodiny" data-delta="-1" aria-label="Ubrat hodinu">−</button>
        <input id="hodiny" type="number" inputmode="numeric" min="1" value="4">
        <button type="button" data-step="hodiny" data-delta="1" aria-label="Přidat hodinu">+</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Open bar</span>
      <div class="toggle" data-toggle="openBar">
        <button type="button" data-value="ano">Ano</button>
        <button type="button" data-value="ne" aria-pressed="true">Ne</button>
      </div>
    </div>

    <div class="row">
      <span class="label">DJ</span>
      <div class="toggle" data-toggle="dj">
        <button type="button" data-value="ano">Ano</button>
        <button type="button" data-value="ne" aria-pressed="true">Ne</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Dekorace</span>
      <div class="toggle" data-toggle="dekorace">
        <button type="button" data-value="ano">Ano</button>
        <button type="button" data-value="ne" aria-pressed="true">Ne</button>
      </div>
    </div>
  </section>

  <section class="card result" aria-live="polite">
    <div class="line"><span>Cena bez DPH</span><span id="bezDph">0 Kč</span></div>
    <div class="line muted"><span id="dphLabel">DPH 21 %</span><span id="dph">0 Kč</span></div>
    <div class="line total"><span>Cena s DPH</span><span id="sDph">0 Kč</span></div>
  </section>

  <section class="card">
    <details open>
      <summary>Ceník – upravte podle sebe (ceny bez DPH)</summary>
      <div class="pricelist" id="cenikList"></div>
      <button type="button" class="reset" id="reset">Obnovit ukázkové ceny</button>
      <p class="note">Změny se počítají hned a uloží se v tomto prohlížeči.</p>
    </details>
  </section>
</main>

<script>
  // Ukázkové ceny (bez DPH, v Kč). Upravují se přímo na stránce v sekci Ceník.
  const VYCHOZI_CENIK = {
    pronajemZaHodinu:      2500,
    obcerstveniNaHosta:     450,
    openBarNaHostaZaHodinu: 120,
    djZaHodinu:            2000,
    dekoracePausal:        3000,
    dekoraceNaHosta:         50,
    dphProcent:              21,
  };
  const POLOZKY = [
    ["pronajemZaHodinu",       "Pronájem prostoru",   "Kč / hod"],
    ["obcerstveniNaHosta",     "Občerstvení",         "Kč / host"],
    ["openBarNaHostaZaHodinu", "Open bar",            "Kč / host / hod"],
    ["djZaHodinu",             "DJ",                  "Kč / hod"],
    ["dekoracePausal",         "Dekorace – paušál",   "Kč"],
    ["dekoraceNaHosta",        "Dekorace – za hosta", "Kč / host"],
    ["dphProcent",             "Sazba DPH",           "%"],
  ];
  const KLIC = "kalkulacka-cenik";

  let CENIK = { ...VYCHOZI_CENIK };
  try { Object.assign(CENIK, JSON.parse(localStorage.getItem(KLIC)) || {}); } catch (e) {}
  const uloz = () => { try { localStorage.setItem(KLIC, JSON.stringify(CENIK)); } catch (e) {} };

  const stav = { openBar: false, dj: false, dekorace: false };
  const kc = n => Math.round(n).toLocaleString("cs-CZ") + " Kč";
  const cislo = id => Math.max(1, parseInt(document.getElementById(id).value, 10) || 0);

  function spocitej() {
    const hoste = cislo("hoste");
    const hodiny = cislo("hodiny");

    let zaklad = CENIK.pronajemZaHodinu * hodiny + CENIK.obcerstveniNaHosta * hoste;
    if (stav.openBar)  zaklad += CENIK.openBarNaHostaZaHodinu * hoste * hodiny;
    if (stav.dj)       zaklad += CENIK.djZaHodinu * hodiny;
    if (stav.dekorace) zaklad += CENIK.dekoracePausal + CENIK.dekoraceNaHosta * hoste;

    const dph = zaklad * CENIK.dphProcent / 100;
    document.getElementById("dphLabel").textContent = `DPH ${CENIK.dphProcent.toLocaleString("cs-CZ")} %`;
    document.getElementById("bezDph").textContent = kc(zaklad);
    document.getElementById("dph").textContent = kc(dph);
    document.getElementById("sDph").textContent = kc(zaklad + dph);
  }

  document.querySelectorAll("[data-step]").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.step);
      const nova = (parseInt(input.value, 10) || 0) + Number(btn.dataset.delta);
      input.value = Math.max(1, nova);
      spocitej();
    });
  });

  document.querySelectorAll("#hoste, #hodiny").forEach(input => {
    input.addEventListener("input", spocitej);
    input.addEventListener("blur", () => { input.value = cislo(input.id); spocitej(); });
  });

  document.querySelectorAll("[data-toggle]").forEach(group => {
    group.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        stav[group.dataset.toggle] = btn.dataset.value === "ano";
        group.querySelectorAll("button").forEach(b =>
          b.setAttribute("aria-pressed", String(b === btn)));
        spocitej();
      });
    });
  });

  const cenikList = document.getElementById("cenikList");
  cenikList.innerHTML = POLOZKY.map(([klic, nazev, jednotka]) => `
    <div class="price">
      <label for="c-${klic}">${nazev}</label>
      <span class="field">
        <input id="c-${klic}" data-cena="${klic}" type="number" inputmode="decimal" min="0" step="any">
        <span class="unit">${jednotka}</span>
      </span>
    </div>`).join("");

  function vyplnCenik() {
    cenikList.querySelectorAll("[data-cena]").forEach(i => { i.value = CENIK[i.dataset.cena]; });
  }
  cenikList.querySelectorAll("[data-cena]").forEach(input => {
    input.addEventListener("input", () => {
      const v = parseFloat(input.value.replace(",", "."));
      CENIK[input.dataset.cena] = isFinite(v) && v >= 0 ? v : 0;
      uloz();
      spocitej();
    });
  });
  document.getElementById("reset").addEventListener("click", () => {
    CENIK = { ...VYCHOZI_CENIK };
    uloz();
    vyplnCenik();
    spocitej();
  });
  vyplnCenik();

  spocitej();
</script>
</body>
</html>
